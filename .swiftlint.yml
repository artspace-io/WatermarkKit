included:
  - WatermarkKit/Classes
  - Example/WatermarkKit
  - Example/Tests

excluded:
  - Example/Pods

line_length:
  warning: 130
  error: 180
  ignores_comments: true

file_length:
  warning: 450
  error: 600

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded: [x, y, w, h, dx, dy, id]

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo
